#         actions:
#           - trash: {}
#
#       - name: Archive large unused videos
#         match: all_of
#         conditions:
#           - extension: *ext_video
#           - size: { gt: 1GB }
#           - not: { name_contains: keep }
#         actions:
#           - archive: { path: /Users/vitoralencar/Archive/Videos, format: zip }
#           - tag_add: [archived, big]
#
#       - name: Timestamp screenshots on save
#         match: all_of
#         conditions:
#           - name_matches: "^Screenshot .*\\.png$"
#         actions:
#           - rename: { pattern: "{yyyy}-{mm}-{dd}_{hh}{mn}_{name}.{ext}" }
#           - move:   { path: /Users/vitoralencar/Pictures/Screenshots }
# =============================================================================
